<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event handlar</title>
</head>
<body>
    <main>
        <h1 id="page-title">Event Handlar By Update </h1>
        <button id="update-title">Update Title </button>
        <br>
        <!-- anather btn -->
        <h2 id="user-info">Login Pleac</h2>
        <button id="login-btn">Login</button>
        <br>
        <br>
        <br>
        <br>
        <section>
            <h2 id="user-name">No User name</h2>
            <input id="input-name" placeholder="Your name" type="text">
            <button id="btn-update">Update</button>
        </section>

    </main>
    <script>
        //    set addEventListener
        document.getElementById('btn-update')
        .addEventListener('click',function(){
            console.log('ai ai aiai')
            // step 2 get the Text form input fild

            const inputName = document.getElementById('input-name');   
            const name = inputName.value;
            //  step 3 set and added the vlue
            
            const UserName = document.getElementById('user-name');
            UserName.innerText = name;

        })
        
    </script>
    <script src="js-file/eventHandlar.js"></script>
</body>
</html>
